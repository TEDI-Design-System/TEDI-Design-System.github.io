<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TEDI Design System Storybook - Access React and Angular component documentation"
    />
    <title>TEDI Design System Storybook</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tedi-design-system/core@6/index.css"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--general-surface-tertiary);
        color: var(--general-text-primary);
        font-family: var(--family-default), system-ui, sans-serif;
        font-size: var(--body-regular-size);
        font-weight: var(--body-regular-weight);
        line-height: var(--body-regular-line-height);
        font-variation-settings: "wdth" 100;
      }

      html body {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        flex: none;
        min-height: 84px;
        padding: 16px 24px;
        background: var(--header-background);
        box-shadow: 0 1px 5px 0 var(--tedi-alpha-20);
      }

      .header__logo {
        display: block;
        height: 32px;
        width: auto;
      }

      .header__logo-link {
        display: inline-flex;
        border-radius: 4px;
      }

      .header__logo-link:focus-visible {
        outline: 2px solid var(--tedi-primary-600);
        outline-offset: 2px;
      }

      /* Main */
      .main {
        flex: 1 0 auto;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: var(--layout-grid-gutters-24);
      }

      .intro {
        display: flex;
        flex-direction: column;
        gap: var(--layout-grid-gutters-16);
        max-width: 700px;
      }

      .breadcrumbs {
        color: var(--general-text-secondary);
        font-size: var(--body-small-regular-size);
        line-height: var(--body-small-regular-line-height);
      }

      .intro__title {
        font-family: var(--family-heading);
        font-size: var(--heading-h1-size);
        font-weight: var(--heading-h1-weight);
        line-height: var(--heading-h1-line-height);
        color: var(--general-text-primary);
      }

      /* Cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--layout-grid-gutters-24);
        align-items: stretch;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--layout-grid-gutters-08);
        padding: var(--card-padding-lg);
        background: var(--card-background-primary);
        border: var(--general-border-width-default) solid
          var(--card-border-primary);
        border-radius: var(--card-radius-rounded);
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }

      .card:hover {
        background-color: var(--button-card-hover-background);
        border-color: var(--button-card-hover-border);
      }

      .card:active {
        background-color: var(--button-card-active-background);
        border-color: var(--button-card-active-border);
      }

      .card:focus-visible {
        outline: none;
        border-radius: var(--card-radius-rounded);
        box-shadow:
          0 0 0 1px var(--tedi-neutral-100),
          0 0 0 3px var(--tedi-primary-500);
      }

      .card__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 4px;
      }

      .card__icon svg {
        display: block;
        width: 56px;
        height: 56px;
      }

      .card__title {
        font-family: var(--family-heading);
        font-size: var(--heading-h6-size);
        font-weight: var(--heading-h6-weight);
        line-height: var(--heading-h6-line-height);
        color: var(--general-text-primary);
      }

      .card__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--button-md-inner-spacing);
        max-width: 384px;
        min-height: var(--button-md-height);
        padding: calc(
            var(--button-md-neutral-padding-y) -
              var(--general-border-width-default)
          )
          0;
        border: var(--general-border-width-default) solid transparent;
        border-radius: var(--button-radius-default);
        background: transparent;
        color: var(--button-main-neutral-text-default);
        font-size: var(--body-regular-size);
        font-weight: var(--body-regular-weight);
        line-height: var(--body-regular-line-height);
        text-align: center;
        transition: color 0.15s;
      }

      .card:hover .card__button {
        color: var(--button-main-neutral-text-hover);
      }

      .card:active .card__button {
        color: var(--button-main-neutral-text-active);
      }

      .card__button svg {
        display: block;
        flex: none;
        width: var(--button-icon-inner-size);
        height: var(--button-icon-inner-size);
      }

      /* Footer */
      .footer {
        flex: none;
        display: flex;
        justify-content: center;
        padding: var(--layout-footer-bottom-padding-y)
          var(--layout-footer-bottom-padding-x);
        background: var(--footer-bottom-background);
        color: var(--general-text-white);
        font-size: var(--body-link-size-regular);
        line-height: var(--body-regular-line-height);
      }

      .footer a {
        color: var(--general-text-white);
        text-decoration: underline;
        text-underline-position: from-font;
        text-decoration-skip-ink: none;
      }

      .footer a:hover {
        text-decoration: none;
      }

      .footer a:focus-visible {
        outline: 2px solid var(--general-text-white);
        outline-offset: 2px;
      }

      @media (max-width: 768px) {
        .main {
          padding: 32px 16px 48px;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .footer {
          padding: var(--layout-footer-bottom-padding-y) 16px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a class="header__logo-link" href="/" aria-label="TEDI Design System">
        <img
          class="header__logo"
          src="TEDI-logo-sinine.svg"
          width="97"
          height="32"
          alt="TEDI"
        />
      </a>
    </header>

    <main class="main">
      <div class="content">
        <div class="intro">
          <nav class="breadcrumbs" aria-label="Breadcrumb">Library</nav>
          <h1 class="intro__title">TEDI Design System</h1>
          <p>
            TEDI ships the same components for both frameworks. Pick the one
            your project uses.
          </p>
        </div>

        <div class="cards">
          <a class="card" href="https://storybook.tedi.ee/react">
            <span class="card__icon">
              <svg
                viewBox="-11.5 -10.23174 23 20.46348"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="0" cy="0" r="2.05" fill="#61dafb" />
                <g stroke="#61dafb" stroke-width="1" fill="none">
                  <ellipse rx="11" ry="4.2" />
                  <ellipse rx="11" ry="4.2" transform="rotate(60)" />
                  <ellipse rx="11" ry="4.2" transform="rotate(120)" />
                </g>
              </svg>
            </span>
            <span class="card__title">React</span>
            <span class="card__button">
              Open React storybook
              <svg
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M15.1136 9.00033L9.0013 15.1126L7.9515 14.0443L12.264 9.75033H2.889V8.25033H12.264L7.9515 3.93783L9.0013 2.88802L15.1136 9.00033Z"
                  fill="currentColor"
                />
              </svg>
            </span>
          </a>

          <a class="card" href="https://storybook.tedi.ee/angular">
            <span class="card__icon">
              <svg viewBox="0 0 250 250" aria-hidden="true" focusable="false">
                <polygon
                  fill="#DD0031"
                  points="125,30 125,30 125,30 31.9,63.2 46.1,186.3 125,230 125,230 125,230 203.9,186.3 218.1,63.2"
                />
                <polygon
                  fill="#C3002F"
                  points="125,30 125,52.2 125,52.1 125,153.4 125,153.4 125,230 125,230 203.9,186.3 218.1,63.2 125,30"
                />
                <path
                  fill="#FFFFFF"
                  d="M125,52.1L66.8,182.6h0h21.7h0l11.7-29.2h49.4l11.7,29.2h0h21.7h0L125,52.1L125,52.1L125,52.1L125,52.1 L125,52.1z M142,135.4H108l17-40.9L142,135.4z"
                />
              </svg>
            </span>
            <span class="card__title">Angular</span>
            <span class="card__button">
              Open Angular storybook
              <svg
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M15.1136 9.00033L9.0013 15.1126L7.9515 14.0443L12.264 9.75033H2.889V8.25033H12.264L7.9515 3.93783L9.0013 2.88802L15.1136 9.00033Z"
                  fill="currentColor"
                />
              </svg>
            </span>
          </a>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>
        Maintained by
        <a href="https://tedi.ee" target="_blank" rel="noopener noreferrer"
          >TEDI</a
        >
      </p>
    </footer>
  </body>
</html>
